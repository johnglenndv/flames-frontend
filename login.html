<!DOCTYPE html>
<html lang = en>
    <head>
        <title>F.L.A.M.E.S.</title>
        <link rel = "stylesheet" href="static/log-sign.css">
        <link rel="icon" type="image/png" href="icons/logo.png">


        
    </head>
    
    <body style="background: linear-gradient(to bottom, #620000fe, #89300064);
                 background-color: #1a0f0d; margin: 0; overflow: hidden;">
 
         
        <div id="container">
            <div id="image">
                <img src = "icons/logo.png" alt = "Frames" width = "80">

                <div class ="login-container">

                        <form id="login-form" class="active" onsubmit="loginUser(event)">
                            
                            <h3 id="h3login">Login</h3>

                            <div>
                                <p><input type = "text" placeholder = "Username or Email" name = "username"></p>
                                <p><input type = "password" placeholder = "Password" name = "userpassword"></p> 
                                <p  style="font-size: 13px; font-family: arial;">Don't have an account? <a href="signup.html">Sign up</a></p>
                                <p><button type ="submit">Login</button></p>
                            </div>

                        </form>

                </div>
            </div>
        </div>


        <script>
        async function loginUser(event) {
            event.preventDefault();

            const username = document.querySelector('[name="username"]').value;
            const password = document.querySelector('[name="userpassword"]').value;

            const res = await fetch(
                "https://flames-backend-hbu0.onrender.com/auth/login",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                }
            );

            const data = await res.json();
            localStorage.setItem("organization", data.organization);
            localStorage.setItem("username", data.username);


            if (res.ok) {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("username", data.username);
                localStorage.setItem("organization", data.organization);

                window.location.href = "dashboard.html";
            } else {
                alert("Login failed");
            }
        }
        </script>


    </body>
</html>
